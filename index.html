<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3df9a"><title>Mensch ärgere Dich nicht – Online</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header><div><h1>Mensch ärgere Dich nicht</h1><p>Online mit 2–6 Spielern</p></div><div id="connection" class="pill">Nicht verbunden</div></header>
<main>
<section id="lobby" class="panel lobby">
 <div class="lobby-grid">
  <div class="card"><h2>Raum erstellen</h2><label>Name<input id="hostName" maxlength="18" placeholder="Dein Name"></label><button id="createBtn">Raum erstellen</button><div id="hostRoom" class="hidden"><small>Raumcode</small><div id="roomCode" class="bigcode"></div></div></div>
  <div class="card"><h2>Raum beitreten</h2><label>Name<input id="joinName" maxlength="18" placeholder="Dein Name"></label><label>Raumcode<input id="joinCode" maxlength="6" placeholder="ABC123" autocapitalize="characters"></label><button id="joinBtn" class="secondary">Raum beitreten</button></div>
 </div>
 <div id="colorPicker" class="card hidden"><h2>Deine Farbe</h2><div id="colors" class="colors"></div><p id="pickHint"></p></div>
 <div id="waiting" class="card hidden"><h2>Spieler im Raum</h2><div id="playersList"></div><p id="waitStatus"></p><button id="startBtn" class="start hidden">Spiel starten</button></div>
 <div id="errorBox" class="error hidden" role="alert"></div>
</section>
<section id="game" class="hidden">
 <div class="game-top panel"><div><strong id="turnName">–</strong><span id="turnColor">–</span></div><div class="die" id="die" aria-live="polite">–</div><button id="rollBtn" class="roll">Würfeln</button><div id="status" class="status"></div></div>
 <div class="game-grid">
  <section class="board-panel"><div id="board" class="board" aria-label="Spielbrett"></div></section>
  <aside class="panel players"><h2>Spieler</h2><div id="scoreboard"></div><button id="newGameBtn" class="secondary">Neues Spiel</button></aside>
 </div>
</section>
</main></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="app.js"></script></body></html>
